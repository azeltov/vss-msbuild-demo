# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: insurance-claims-triage
description: |
    Insurance claims triage coordinator. Orchestrates the NVIDIA VSS Agent
    (video understanding sub-agent) plus mock policy / pricing / claim-PDF
    tools to turn a customer's damage video into a draft claim.
metadata:
    tags:
        - Insurance
        - VSS
        - Multi-agent
        - Agent Framework
        - Responses Protocol
protocols:
    - protocol: responses
      version: 1.0.0
resources:
    cpu: "0.25"
    memory: 0.5Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-4.1
    - name: VSS_BASE_URL
      value: http://vss.104.45.71.11.nip.io
